[package]
name = "ufbx"
version = "0.21.2"
edition = "2021"
authors = ["Samuli Raivio", "Contributors"]
license = "MIT OR Unlicense"
description = "Pure Rust FBX file loader - no C/C++ toolchain required"
repository = "https://github.com/ufbx/ufbx"
readme = "README.md"
keywords = ["fbx", "3d", "graphics", "gamedev", "format"]
categories = ["parser-implementations", "graphics", "game-development"]

[dependencies]
flate2 = "1.0"           # DEFLATE decompression for FBX
byteorder = "1.5"        # Binary format parsing
thiserror = "1.0"        # Ergonomic error types
rayon = { version = "1.8", optional = true }  # Parallel iterators
smallvec = "1.11"        # Stack-allocated small vectors
ahash = "0.8"            # Faster HashMap implementation

[dev-dependencies]
criterion = "0.5"        # Benchmarking
approx = "0.5"           # Float comparisons in tests

[features]
default = ["std", "obj-support", "parallel"]
std = []
# Feature flags for optional components
obj-support = []         # Wavefront OBJ file support
nurbs = []               # NURBS evaluation
subdivision = []         # Subdivision surfaces
geometry-cache = []      # Geometry cache support
parallel = ["rayon"]     # Enable parallel processing with rayon
writer = []              # Enable FBX file writing functionality

[lib]
name = "ufbx"
path = "src/lib.rs"

[[example]]
name = "load_scene"
path = "examples/load_scene.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2
